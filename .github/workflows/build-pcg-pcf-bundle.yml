name: Build PCG-PCF paper bundle

on:
  push:
    branches: [chatgpt-pcg-pcf-bundle-20260730]
    paths: [".github/workflows/build-pcg-pcf-bundle.yml", "paper-bundle-pcg/**"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/build-pcg-pcf-bundle.yml", "paper-bundle-pcg/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - name: Publish run locator immediately
        if: github.event_name == 'push'
        run: |
          mkdir -p .build-status
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "source_sha=${GITHUB_SHA}"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .build-status/pcg-pcf-latest-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .build-status/pcg-pcf-latest-run.txt
          git commit -m "Record active PCG-PCF bundle run" || true
          git push
      - name: Install validators
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf zip
      - name: Build verified archive
        run: python3 paper-bundle-pcg/build_bundle.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: PCG-PCF-papers-2016-2026
          path: output/PCG_PCF_papers_2016-2026_2026-07-30.zip
          if-no-files-found: error
          retention-days: 7

# Temporary artifact build only; versioned ePrint mirror fallback enabled.
