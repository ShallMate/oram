name: Fetch USENIX 2025 Flexway O-Sort paper

on:
  push:
    branches:
      - chatgpt-oblivious-sorting-bundle-20260724
    paths:
      - ".github/workflows/fetch-flexway-paper.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fetch-flexway-paper.yml"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and validate PDF
        shell: bash
        run: |
          set -Eeuo pipefail
          name="05_USENIX2025_Flexway_O-Sort.pdf"
          curl --location --fail --silent --show-error --retry 3 \
            --output "$name" \
            "https://www.usenix.org/system/files/usenixsecurity25-gu-tianyao.pdf"
          python3 - "$name" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          data = p.read_bytes()
          assert len(data) > 100_000 and data.startswith(b"%PDF-"), "invalid PDF"
          print(f"Validated {p.name}: {len(data)} bytes")
          PY
          pdftotext -f 1 -l 1 "$name" - | grep -qi "Flexway O-Sort"
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: USENIX2025-Flexway-O-Sort
          path: 05_USENIX2025_Flexway_O-Sort.pdf
          retention-days: 7
          compression-level: 0
